[env:esp32-c6-devkitm-1]
platform = espressif32
; Keep the existing env name so the current sdkconfig file remains in use.
; Only switch the board target to the generic ESP32-C6 DevKitC definition.
board = esp32-c6-devkitc-1
framework = espidf
